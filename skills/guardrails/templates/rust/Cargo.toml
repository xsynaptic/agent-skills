[workspace]
members = ["xtask"]
resolver = "3"

[workspace.lints.rust]
redundant_lifetimes = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unreachable_pub = "warn"
# `#[expect]` can't lift `forbid`; a workspace with one unsafe crate sets `warn` and that crate expects it
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

# cargo-shear owns unused dependencies
[workspace.lints.cargo]
unused_dependencies = "allow"

# Restriction lints are cherry-picked; the whole group contradicts itself
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
mod_module_files = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
