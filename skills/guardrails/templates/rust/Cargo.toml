[workspace]

[workspace.lints.rust]
let_underscore_drop = "warn"
redundant_lifetimes = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unreachable_pub = "warn"
# `#[expect]` can't lift `forbid`; a workspace with one unsafe crate sets `warn` and that crate expects it
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

# cargo-shear owns unused dependencies
[workspace.lints.cargo]
unused_dependencies = "allow"

# Restriction lints are cherry-picked; the whole group contradicts itself
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
let_underscore_must_use = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mod_module_files = "warn"
panic = "warn"
string_slice = "warn"
todo = "warn"
unimplemented = "warn"
unused_result_ok = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
