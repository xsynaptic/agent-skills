# Commits tidy what they touch; `pnpm check` is the gate
pre-commit:
  jobs:
    # Git hooks run without node_modules/.bin on PATH
    # ESLint exits 1 for findings it could not fix, which wait for `pnpm check`; 2 is a crash
    - name: lint
      glob: "*.ts"
      run: node_modules/.bin/eslint --fix --cache --cache-location node_modules/.cache/eslint/ {staged_files} || [ $? -eq 1 ]
      stage_fixed: true
    - name: format
      run: node_modules/.bin/prettier --write --ignore-unknown --log-level warn {staged_files}
      stage_fixed: true

check:
  parallel: true
  jobs:
    - name: format
      run: prettier --check --log-level warn .
    - name: types
      run: tsc
    # A type-aware finding caused by an edit elsewhere waits until its own file changes; `rm -r node_modules/.cache/eslint` rechecks all
    - name: lint
      run: eslint --cache --cache-location node_modules/.cache/eslint/ .
